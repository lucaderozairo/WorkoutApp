<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout App Prototype</title>
    <link rel="stylesheet" href="./styling/global.css" />
  </head>
  <body>
    <main>
      <section class="surface stack">
        <div class="stack compact">
          <span class="eyebrow">Prototype</span>
          <h1>Workout App</h1>
        </div>
        <div class="surface stack compact">
          <span>Enter display name</span>
          <input type="text" placeholder="Display Name">
        </div>
        
        <div class="surface stack compact">
        <div class="row space-between">
          <input
            id="session-file"
            type="file"
            accept=".json,application/json, .csv"
          />
          <label for="session-file" class="custom-file-upload">
            Import Session History
          </label>
          <button id="load-mock-data" type="button" class="neutral">
            Load Mock Data
          </button>
        </div>

        <section class="surface compact card--flat stack">
          <p class="caption" id="status-message">
            Session data accepts exported JSON. Mock data starts the prototype with seeded sample content.
          </p>
        </section>
        </div>
        
      </section>
    </main>

    <script>
      const PERSISTED_KEYS = [
        'session_history',
        'recent_cardio_sessions',
        'exercise_progressions',
      ];
      const STORAGE_PREFIX = 'workout-app:';
      const APP_URL = './index.html#/dashboard';

      const fileInput = document.getElementById('session-file');
      const mockButton = document.getElementById('load-mock-data');
      const statusMessage = document.getElementById('status-message');

      function setStatus(message) {
        statusMessage.textContent = message;
      }

      function clearPersistedData() {
        PERSISTED_KEYS.forEach((key) => localStorage.removeItem(STORAGE_PREFIX + key));
      }

      function launchApp() {
        window.location.href = APP_URL;
      }

      function storeEnvelope(raw) {
        const parsed = JSON.parse(raw);
        const payload = parsed && typeof parsed === 'object' ? parsed.data : null;

        if (!payload || typeof payload !== 'object') {
          throw new Error('Expected an export with a top-level "data" object.');
        }

        clearPersistedData();

        PERSISTED_KEYS.forEach((key) => {
          if (Object.prototype.hasOwnProperty.call(payload, key)) {
            localStorage.setItem(
              STORAGE_PREFIX + key,
              JSON.stringify(payload[key]),
            );
          }
        });
      }

      fileInput.addEventListener('change', async (event) => {
        const [file] = event.target.files || [];
        if (!file) return;

        try {
          setStatus('Loading session data...');
          const raw = await file.text();
          storeEnvelope(raw);
          setStatus('Session data loaded. Opening prototype...');
          launchApp();
        } catch (error) {
          setStatus(error instanceof Error ? error.message : 'Could not load that file.');
        } finally {
          fileInput.value = '';
        }
      });

      mockButton.addEventListener('click', () => {
        clearPersistedData();
        setStatus('Mock data selected. Opening prototype...');
        launchApp();
      });
    </script>
  </body>
</html>
