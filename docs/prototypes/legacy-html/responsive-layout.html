<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Layout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nav-width: 220px;
      --nav-bottom-height: 64px;
      --bg: #f5f4f0;
      --surface: #ffffff;
      --nav-bg: #ffffff;
      --text: #1a1a18;
      --text-muted: #888780;
      --border: rgba(0,0,0,0.1);
      --accent: #533AB7;
      --accent-light: #EEEDFE;
      --radius: 10px;
      --font: 'Georgia', serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a18;
        --surface: #242422;
        --nav-bg: #1e1e1c;
        --text: #f0ede8;
        --text-muted: #888780;
        --border: rgba(255,255,255,0.08);
        --accent: #AFA9EC;
        --accent-light: #26215C;
      }
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    /* ── NAV ── */
    nav {
      background: var(--nav-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      width: var(--nav-width);
      min-height: 100vh;
      position: sticky;
      top: 0;
      flex-shrink: 0;
    }

    .nav-logo {
      padding: 1.5rem 1.5rem 1.5rem;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: -0.02em;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      height: 50px;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      padding: 1rem 0.75rem;
      gap: 2px;
      flex: 1;
    }

    .nav-links a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0.6rem 0.75rem;
      border-radius: var(--radius);
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.15s, color 0.15s;
    }

    .nav-links a:hover { background: var(--accent-light); color: var(--accent); }
    .nav-links a.active { background: var(--accent-light); color: var(--accent); font-weight: bold; }

    .nav-links a svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* ── MAIN ── */
    main {
      flex: 1;
      padding: 2.5rem;
    }

    main h1 { font-size: 1.8rem; letter-spacing: -0.03em; margin-bottom: 0.5rem; }
    main p { color: var(--text-muted); line-height: 1.7; font-size: 0.95rem; margin-bottom: 1.5rem; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }

    .card h3 { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .card p { font-size: 1.5rem; color: var(--text); margin: 0; font-weight: bold; }

    /* ── MOBILE: bottom nav ── */
    @media (max-width: 767px) {
      body { flex-direction: column; padding-bottom: var(--nav-bottom-height); }

      nav {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        top: auto;
        width: 100%;
        min-height: unset;
        height: var(--nav-bottom-height);
        flex-direction: row;
        align-items: stretch;
        border-right: none;
        border-top: 1px solid var(--border);
        z-index: 100;
      }

      .nav-logo { display: none; }

      .nav-links {
        flex-direction: row;
        padding: 0;
        gap: 0;
        width: 100%;
      }

      .nav-links a {
        flex: 1;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 4px;
        border-radius: 0;
        padding: 0.5rem 0;
        font-size: 0.7rem;
      }

      .nav-links a svg { width: 22px; height: 22px; }

      main { padding: 1.5rem 1rem; }
      main h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-logo">Acme</div>
    <div class="nav-links">
      <a href="#" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Messages
      </a>
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        Settings
      </a>
    </div>
  </nav>

  <main>
    <h1>Dashboard</h1>
    <p>Welcome back. Here's what's happening today.</p>
    <div class="cards">
      <div class="card"><h3>Revenue</h3><p>£48,200</p></div>
      <div class="card"><h3>Users</h3><p>3,841</p></div>
      <div class="card"><h3>Sessions</h3><p>12,390</p></div>
      <div class="card"><h3>Conversion</h3><p>4.2%</p></div>
    </div>
  </main>

</body>
</html>
