<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Route Planner Prototype</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Inter, sans-serif;
    background: #f3f4f6;
    height: 100vh;
    overflow: hidden;
  }

  .app {
    height: 100vh;
    padding: 12px;

    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* SEARCH */

  .search-bar {
    width: 100%;
    height: 56px;

    border: none;
    border-radius: 16px;

    padding: 0 18px;

    font-size: 15px;
    background: white;

    outline: none;
    flex-shrink: 0;
  }

  /* MAP */

  .map-container {
    position: relative;

    flex: 1;
    overflow: hidden;

    border-radius: 20px;
    background: #58d68d;
  }

  /* CONTROLS */

  .map-controls {
    position: absolute;

    top: 16px;
    left: 16px;

    display: flex;
    flex-direction: column;
    gap: 8px;

    z-index: 20;
  }

  .map-controls button {
    width: 42px;
    height: 42px;

    border: none;
    border-radius: 12px;

    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(8px);

    cursor: pointer;
    font-size: 18px;
  }

  /* ROUTE */

  .route-overlay {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;
  }

  .route-shadow {
    fill: none;

    stroke: rgba(0,0,0,0.12);
    stroke-width: 18;

    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .route-line {
    fill: none;

    stroke: white;
    stroke-width: 10;

    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .route-point {
    stroke: white;
    stroke-width: 4;
  }

  .start-point {
    fill: #16a34a;
  }

  .mid-point {
    fill: #2563eb;
  }

  .finish-point {
    fill: #ef4444;
  }

  /* TOOLS */

  .tools-container {
    position: absolute;

    top: 50%;
    right: 16px;

    transform: translateY(-50%);

    width: 190px;
    padding: 12px;

    display: flex;
    flex-direction: column;
    gap: 18px;

    background: rgba(255,255,255,0.84);
    backdrop-filter: blur(12px);

    border-radius: 18px;

    z-index: 20;
  }

  .tool-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .tool-label {
    font-size: 11px;
    font-weight: 600;

    letter-spacing: 0.08em;
    text-transform: uppercase;

    color: rgba(0,0,0,0.55);

    padding: 0 4px 2px;
  }

  .tool-button {
    height: 40px;

    border: none;
    border-radius: 10px;

    background: transparent;

    cursor: pointer;

    font-size: 13px;
    text-align: left;

    padding: 0 10px;

    transition: background 0.15s ease;
  }

  .tool-button:hover {
    background: rgba(0,0,0,0.06);
  }

  /* MOBILE */

  @media (max-width: 600px) {

    body {
      overflow: auto;
    }

    .app {
      height: auto;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      gap: 12px;
    }

    .search-bar {
      width: 100%;
      flex-shrink: 0;
    }

    .map-container {
      position: relative;

      width: 100%;
      height: 65vh;
      min-height: 500px;

      flex: none;
    }

    .tools-container {
      position: relative;

      top: auto;
      right: auto;

      transform: none;

      width: 100%;
      margin-top: 0;

      display: flex;
      flex-direction: row;

      gap: 14px;
      padding: 12px;

      overflow-x: auto;
      overflow-y: hidden;

      scrollbar-width: none;
    }

    .tools-container::-webkit-scrollbar {
      display: none;
    }

    .tool-group {
      min-width: 180px;
      flex-shrink: 0;
    }
  }
</style>
</head>

<body>

<div class="app">

  <!-- SEARCH -->

  <input
    class="search-bar"
    type="text"
    placeholder="Search routes, places, trails..."
  />

  <!-- MAP -->

  <div class="map-container">

    <!-- CONTROLS -->

    <div class="map-controls">
      <button>+</button>
      <button>−</button>
      <button>◎</button>
      <button>⤢</button>
    </div>

    <!-- ROUTE -->

    <svg
      class="route-overlay"
      viewBox="0 0 1200 800"
      preserveAspectRatio="none"
    >

      <path
        class="route-shadow"
        d="M120 620
           C220 540, 280 480, 360 500
           S520 620, 650 520
           S860 300, 1040 420"
      />

      <path
        class="route-line"
        d="M120 620
           C220 540, 280 480, 360 500
           S520 620, 650 520
           S860 300, 1040 420"
      />

      <!-- START -->

      <circle
        class="route-point start-point"
        cx="120"
        cy="620"
        r="11"
      />

      <!-- MID -->

      <circle
        class="route-point mid-point"
        cx="360"
        cy="500"
        r="10"
      />

      <circle
        class="route-point mid-point"
        cx="650"
        cy="520"
        r="10"
      />

      <!-- FINISH -->

      <circle
        class="route-point finish-point"
        cx="1040"
        cy="420"
        r="11"
      />

    </svg>

  </div>

  <!-- TOOLS -->

  <aside class="tools-container">

    <div class="tool-group">
      <div class="tool-label">Route</div>

      <button class="tool-button">
        ✏️ Draw Route
      </button>

      <button class="tool-button">
        ✂️ Cut Segment
      </button>

      <button class="tool-button">
        🧹 Clear Route
      </button>
    </div>

    <div class="tool-group">
      <div class="tool-label">Edit</div>

      <button class="tool-button">
        ↩️ Undo
      </button>

      <button class="tool-button">
        ↪️ Redo
      </button>

      <button class="tool-button">
        🔄 Reverse Route
      </button>
    </div>

  </aside>

</div>

</body>
</html>
