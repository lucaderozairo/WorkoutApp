<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrollable Grid Row</title>

<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #f5f5f5;
  }

  .grid-row {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: auto;
    gap: 1rem;

    overflow-x: auto;
    overflow-y: hidden;

    padding: 1rem;

  }

  .card {
    height: 80px;
    width: 150px;
    background: white;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 1.25rem;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
  }
</style>
</head>
<body>

<h2>Scrollable Grid Row</h2>

<div class="grid-row">
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
</div>

</body>
</html>
