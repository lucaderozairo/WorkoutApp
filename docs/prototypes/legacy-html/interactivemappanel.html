<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Map</title>
    <!-- Load Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>
    <!-- Load your custom CSS (optional) -->
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        #map {
            width: 280px;
            height: 355px;
        }
        .custom-content {
            padding: 10px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <!-- Leaflet Map Container -->
    <div id="map"></div>

    <!-- Searchbar for Location -->
    <input type="text" id="location-search" class="custom-content">

    <!-- Zoom Controls -->
    <div class="custom-content">
        <button id="zoom-in">Zoom In</button>
        <button id="zoom-out">Zoom Out</button>
    </div>

    <!-- Layers and Visible Content -->
    <div class="custom-content">
        <label for="base-layer">Base Layer:</label>
        <select id="base-layer">
            <option value="openstreetmap">OpenStreetMap</option>
            <option value="streets">Streets</option>
        </select>

        <label for="layer-group">Layer Group:</label>
        <select id="layer-group">
            <!-- Add layer options here -->
        </select>
    </div>

    <!-- Undo/Redo Controls -->
    <div class="custom-content">
        <button id="undo">Undo</button>
        <button id="redo">Redo</button>
    </div>

    <!-- Panning Map -->
    <div class="custom-content">
        <button id="pan-left">Pan Left</button>
        <button id="pan-right">Pan Right</button>
        <button id="pan-up">Pan Up</button>
        <button id="pan-down">Pan Down</button>
    </div>

    <!-- Route Editing Controls -->
    <div class="custom-content">
        <button id="route-start">Start Route</button>
        <button id="route-stop">Stop Route</button>
        <button id="route-edit">Edit Route</button>
    </div>

    <!-- Load Leaflet JS and initialize the map -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Initialize the map
        var map = L.map('map').setView([51.505, -0.09], 13);

        // Add a tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Searchbar for Location
        document.getElementById('location-search').addEventListener('input', function() {
            var location = this.value;
            if (location) {
                map.flyTo(location.split(',').map(parseFloat), 15);
            }
        });

        // Zoom Controls
        document.getElementById('zoom-in').addEventListener('click', function() {
            map.zoomIn();
        });
        document.getElementById('zoom-out').addEventListener('click', function() {
            map.zoomOut();
        });

        // Layers and Visible Content
        var baseLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });
        var layerGroup = new L.LayerGroup();

        // Add a base layer to the map
        map.addLayer(baseLayer);

        // Add a layer group to the map
        map.addLayer(layerGroup);

        // Undo/Redo Controls
        document.getElementById('undo').addEventListener('click', function() {
            // Implement undo functionality here
        });
        document.getElementById('redo').addEventListener('click', function() {
            // Implement redo functionality here
        });

        // Panning Map
        document.getElementById('pan-left').addEventListener('click', function() {
            map.panBy([-10, 0]);
        });
        document.getElementById('pan-right').addEventListener('click', function() {
            map.panBy([10, 0]);
        });
        document.getElementById('pan-up').addEventListener('click', function() {
            map.panBy([0, 10]);
        });
        document.getElementById('pan-down').addEventListener('click', function() {
            map.panBy([0, -10]);
        });

        // Route Editing Controls
        document.getElementById('route-start').addEventListener('click', function() {
            // Implement route start functionality here
        });
        document.getElementById('route-stop').addEventListener('click', function() {
            // Implement route stop functionality here
        });
        document.getElementById('route-edit').addEventListener('click', function() {
            // Implement route edit functionality here
        });
    </script>
</body>
</html>
