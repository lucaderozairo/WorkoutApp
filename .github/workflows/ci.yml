name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (architecture boundaries)
        run: npm run lint

      - name: Lint CSS (token discipline)
        run: npm run lint:css

      - name: Lint UI (atomic design system)
        run: npm run lint:ui

      - name: Build
        run: npx vite build

      - name: Test
        run: npm test
